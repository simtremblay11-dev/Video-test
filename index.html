<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Particle Vision</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 95vw;
    }

    button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:active { background: rgba(255,255,255,0.3); }
    #clear-btn {
      background: rgba(255,80,80,0.2);
      border-color: rgba(255,100,100,0.5);
      color: #ff8080;
      display: none;
    }

    #canvas { display: block; width: 100vw; height: 100vh; }

    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 20;
      gap: 24px;
    }
    #start-screen h1 {
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 2px;
      text-align: center;
    }
    #start-screen p {
      color: rgba(255,255,255,0.5);
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
    }
    #start-btn {
      font-size: 17px;
      padding: 14px 36px;
      background: rgba(255,200,80,0.2);
      border-color: rgba(255,200,80,0.6);
      color: #ffc850;
    }
    #mode-label {
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, sans-serif;
      font-size: 13px;
    }
    #loading {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,200,80,0.7);
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      z-index: 10;
      display: none;
    }
    /* Drawing mode hint */
    #draw-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      z-index: 10;
      display: none;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>PARTICLE VISION</h1>
  <p>Montre tes mains à la caméra pour les effets interactifs</p>
  <button id="start-btn">Activer la caméra</button>
</div>

<canvas id="canvas"></canvas>

<div id="ui" style="display:none">
  <button id="flip-btn">Flip cam</button>
  <span id="mode-label">Mode: Particules</span>
  <button id="mode-btn">Changer</button>
  <button id="clear-btn">Effacer</button>
</div>

<div id="loading">Chargement détection mains...</div>
<div id="draw-hint">☝️ Index levé = dessine · ✊ Poing = pause</div>

<video id="video" autoplay playsinline muted style="display:none"></video>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const loadingEl = document.getElementById('loading');
const drawHintEl = document.getElementById('draw-hint');
const clearBtn = document.getElementById('clear-btn');

let W, H;
let facingMode = 'user';
let stream = null;
let animId = null;

// Motion detection
const motionCanvas = document.createElement('canvas');
const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
let prevFrame = null;

// Persistent drawing layer
const drawingCanvas = document.createElement('canvas');
const drawingCtx = drawingCanvas.getContext('2d');
let drawHue = 0;

// Smooth drawing: rolling 3-point buffer for quadratic bezier splines
let drawPoints = [];

// Sparkle particles (ephemeral, drawn on main canvas)
const sparkles = [];

// Particles
const PARTICLE_COUNT = 120;
const MAX_DIST = 130;
let particles = [];

// Modes: 0=particles, 1=edge, 2=motion, 3=dessin
let mode = 0;
const modeNames = ['Particules', 'Contours', 'Motion', 'Dessin'];

const FINGERTIPS = [4, 8, 12, 16, 20];

// MediaPipe hand connections (pairs of landmark indices)
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];

let handData = { left: null, right: null };
let handsReady = false;
let lastHandSend = 0;

// ── MediaPipe ────────────────────────────────────────────────────
const hands = new Hands({
  locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });
hands.onResults((results) => {
  handData = { left: null, right: null };
  if (!results.multiHandLandmarks) return;
  results.multiHandLandmarks.forEach((lms, i) => {
    handData[results.multiHandedness[i].label.toLowerCase()] = lms;
  });
});

async function initHands() {
  loadingEl.style.display = 'block';
  await hands.initialize();
  handsReady = true;
  loadingEl.style.display = 'none';
}

// ── Resize ───────────────────────────────────────────────────────
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  motionCanvas.width = Math.floor(W / 4);
  motionCanvas.height = Math.floor(H / 4);
  drawingCanvas.width = W;
  drawingCanvas.height = H;
  initParticles();
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
      r: Math.random() * 2.5 + 1, hue: Math.random() * 60 + 30,
    });
  }
}

// Convert normalized landmark → canvas px (mirrors for selfie cam)
function lmToCanvas(lm) {
  return {
    x: facingMode === 'user' ? (1 - lm.x) * W : lm.x * W,
    y: lm.y * H,
  };
}

// ── Camera ───────────────────────────────────────────────────────
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    resize();
    document.getElementById('ui').style.display = 'flex';
    if (animId) cancelAnimationFrame(animId);
    loop();
  } catch (e) {
    alert('Caméra inaccessible: ' + e.message);
  }
}

// ── Motion zones ─────────────────────────────────────────────────
function getMotionZones() {
  const mw = motionCanvas.width, mh = motionCanvas.height;
  motionCtx.drawImage(video, 0, 0, mw, mh);
  const curr = motionCtx.getImageData(0, 0, mw, mh);
  const zones = [];
  if (!prevFrame) { prevFrame = curr; return zones; }
  const cd = curr.data, pd = prevFrame.data;
  for (let i = 0; i < cd.length; i += 16) {
    const diff = Math.abs(cd[i]-pd[i]) + Math.abs(cd[i+1]-pd[i+1]) + Math.abs(cd[i+2]-pd[i+2]);
    if (diff > 40) {
      zones.push({ x: ((i/4)%mw/mw)*W, y: (Math.floor((i/4)/mw)/mh)*H, intensity: Math.min(diff/255,1) });
    }
  }
  prevFrame = curr;
  return zones;
}

// ── Main loop ────────────────────────────────────────────────────
function loop() {
  animId = requestAnimationFrame(loop);
  if (video.readyState < 2) return;

  const now = performance.now();
  if (handsReady && now - lastHandSend > 33) {
    hands.send({ image: video });
    lastHandSend = now;
  }

  const motionZones = getMotionZones();

  if (mode === 3) {
    // Dessin: black background, no video
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.save();
    if (facingMode === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
  }

  if (mode === 0) drawParticles(motionZones);
  else if (mode === 1) drawEdgeGlow();
  else if (mode === 2) drawMotionBurst(motionZones);
  else if (mode === 3) drawDessinMode();
}

// ── Mode 0: Particules ───────────────────────────────────────────
function drawParticles(motionZones) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    for (const z of motionZones) {
      const dx = z.x-p.x, dy = z.y-p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 200) { p.vx += (dx/dist)*z.intensity*0.4; p.vy += (dy/dist)*z.intensity*0.4; }
    }
    p.vx *= 0.97; p.vy *= 0.97;
    p.x = Math.max(0, Math.min(W, p.x + p.vx));
    p.y = Math.max(0, Math.min(H, p.y + p.vy));
    if (p.x <= 0 || p.x >= W) p.vx *= -1;
    if (p.y <= 0 || p.y >= H) p.vy *= -1;
  }

  for (let i = 0; i < particles.length; i++) {
    for (let j = i+1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d < MAX_DIST) {
        const alpha = (1-d/MAX_DIST)*0.5;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle = `hsla(${(a.hue+b.hue)/2},90%,75%,${alpha})`;
        ctx.lineWidth = alpha*1.5; ctx.stroke();
      }
    }
  }
  for (const p of particles) {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},100%,85%,0.9)`;
    ctx.shadowColor = `hsla(${p.hue},100%,70%,0.8)`; ctx.shadowBlur = 8;
    ctx.fill(); ctx.shadowBlur = 0;
  }
  drawFingerLinks();
}

function drawFingerLinks() {
  const { left, right } = handData;
  if (!left && !right) return;
  const t = performance.now() / 1000;
  const leftTips  = left  ? FINGERTIPS.map(i => lmToCanvas(left[i]))  : null;
  const rightTips = right ? FINGERTIPS.map(i => lmToCanvas(right[i])) : null;

  if (leftTips && rightTips) {
    for (let li = 0; li < leftTips.length; li++) {
      for (let ri = 0; ri < rightTips.length; ri++) {
        const a = leftTips[li], b = rightTips[ri];
        const dist = Math.hypot(a.x-b.x, a.y-b.y);
        if (dist > W*0.8) continue;
        const alpha = Math.max(0, 1-dist/(W*0.8));
        const hue = (li*30 + ri*20 + t*40) % 360;
        ctx.save();
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle = `hsla(${hue},100%,75%,${alpha*0.9})`;
        ctx.lineWidth = 2.5*alpha;
        ctx.shadowColor = `hsla(${hue},100%,70%,${alpha})`; ctx.shadowBlur = 18;
        ctx.stroke(); ctx.restore();
      }
    }
  }
  for (const [tips, baseHue] of [[leftTips, 45], [rightTips, 200]]) {
    if (!tips) continue;
    for (const tip of tips) {
      ctx.save(); ctx.beginPath(); ctx.arc(tip.x, tip.y, 7, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${baseHue},100%,85%,0.95)`;
      ctx.shadowColor = `hsla(${baseHue},100%,70%,1)`; ctx.shadowBlur = 20;
      ctx.fill(); ctx.restore();
    }
  }
}

// ── Mode 1: Edge glow ────────────────────────────────────────────
function drawEdgeGlow() {
  ctx.save();
  ctx.globalCompositeOperation = 'difference';
  ctx.filter = 'blur(2px)';
  if (facingMode === 'user') { ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore(); ctx.filter = 'none';
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = 'rgba(255,180,30,0.15)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';
}

// ── Mode 2: Motion burst ─────────────────────────────────────────
function drawMotionBurst(motionZones) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0,0,W,H);
  for (const z of motionZones) {
    const r = z.intensity*80+20;
    const grad = ctx.createRadialGradient(z.x,z.y,0,z.x,z.y,r);
    grad.addColorStop(0, `rgba(255,200,60,${z.intensity*0.6})`);
    grad.addColorStop(0.5, `rgba(255,80,200,${z.intensity*0.3})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(z.x,z.y,r,0,Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
  }
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},100%,85%,0.3)`; ctx.fill();
  }
}

// ── Mode 3: Dessin ───────────────────────────────────────────────
function isIndexUp(lms)     { return lms[8].y  < lms[6].y;  }
function isOthersClosed(lms){ return lms[12].y > lms[10].y && lms[16].y > lms[14].y && lms[20].y > lms[18].y; }

// Add point to buffer and draw one smooth bezier segment onto drawingCtx
function addSmoothPoint(x, y, color, brushSize) {
  drawPoints.push({ x, y });
  if (drawPoints.length > 3) drawPoints.shift();
  const n = drawPoints.length;

  drawingCtx.strokeStyle = color;
  drawingCtx.lineWidth   = brushSize;
  drawingCtx.lineCap     = 'round';
  drawingCtx.lineJoin    = 'round';

  if (n === 2) {
    // First segment: plain line
    drawingCtx.beginPath();
    drawingCtx.moveTo(drawPoints[0].x, drawPoints[0].y);
    drawingCtx.lineTo(drawPoints[1].x, drawPoints[1].y);
    drawingCtx.stroke();
  } else if (n === 3) {
    // Smooth quadratic bezier: midpoints are start/end, middle point is control
    const mid0 = { x: (drawPoints[0].x + drawPoints[1].x) / 2, y: (drawPoints[0].y + drawPoints[1].y) / 2 };
    const mid1 = { x: (drawPoints[1].x + drawPoints[2].x) / 2, y: (drawPoints[1].y + drawPoints[2].y) / 2 };
    drawingCtx.beginPath();
    drawingCtx.moveTo(mid0.x, mid0.y);
    drawingCtx.quadraticCurveTo(drawPoints[1].x, drawPoints[1].y, mid1.x, mid1.y);
    drawingCtx.stroke();
  }
}

// Spawn sparkle burst at drawing tip
function spawnSparkles(x, y, hue) {
  if (sparkles.length > 250) return;
  for (let i = 0; i < 4; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = Math.random() * 3 + 0.8;
    sparkles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 2.5,
      hue: (hue + (Math.random() - 0.5) * 50 + 360) % 360,
      life: 1,
      r: Math.random() * 3 + 1.5,
    });
  }
}

// Update and draw sparkles onto main canvas
function tickSparkles() {
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x  += s.vx; s.y  += s.vy;
    s.vy += 0.18; s.vx *= 0.97;
    s.life -= 0.028;
    if (s.life <= 0) { sparkles.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = s.life * s.life; // fade quadratically
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fillStyle  = `hsl(${s.hue}, 100%, 70%)`;
    ctx.shadowColor = `hsl(${s.hue}, 100%, 60%)`;
    ctx.shadowBlur  = 8;
    ctx.fill();
    ctx.restore();
  }
}

function drawDessinMode() {
  // Persistent drawing layer
  ctx.drawImage(drawingCanvas, 0, 0);

  // Hand skeleton(s)
  for (const lms of [handData.left, handData.right]) {
    if (!lms) continue;
    for (const [a, b] of HAND_CONNECTIONS) {
      const pa = lmToCanvas(lms[a]), pb = lmToCanvas(lms[b]);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    }
    for (let i = 0; i < lms.length; i++) {
      const p = lmToCanvas(lms[i]);
      const isTip = FINGERTIPS.includes(i);
      ctx.beginPath();
      ctx.arc(p.x, p.y, isTip ? 6 : 3, 0, Math.PI * 2);
      ctx.fillStyle = isTip ? '#fff' : 'rgba(255,255,255,0.5)';
      if (isTip) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 10; }
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }

  // Finger drawing (right hand preferred)
  const lms = handData.right || handData.left;
  if (lms && isIndexUp(lms) && isOthersClosed(lms)) {
    const tip  = lmToCanvas(lms[8]);
    drawHue = (drawHue + 2) % 360;
    const color = `hsl(${drawHue}, 100%, 60%)`;

    addSmoothPoint(tip.x, tip.y, color, 6);
    spawnSparkles(tip.x, tip.y, drawHue);

    // Glow cursor
    ctx.save();
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 11, 0, Math.PI * 2);
    ctx.fillStyle  = `hsla(${drawHue}, 100%, 65%, 0.55)`;
    ctx.shadowColor = color; ctx.shadowBlur = 22;
    ctx.fill(); ctx.restore();
  } else {
    drawPoints = []; // reset buffer on lift
  }

  tickSparkles();
}

// ── Events ───────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  document.getElementById('start-screen').style.display = 'none';
  await startCamera();
  initHands();
});

document.getElementById('flip-btn').addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

document.getElementById('mode-btn').addEventListener('click', () => {
  mode = (mode + 1) % modeNames.length;
  document.getElementById('mode-label').textContent = 'Mode: ' + modeNames[mode];
  const isDessin = mode === 3;
  clearBtn.style.display = isDessin ? 'block' : 'none';
  drawHintEl.style.display = isDessin ? 'block' : 'none';
});

clearBtn.addEventListener('click', () => {
  drawingCtx.clearRect(0, 0, W, H);
  drawPoints = [];
});

window.addEventListener('resize', resize);
</script>
</body>
</html>
