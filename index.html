<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Particle Vision</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    button:active { background: rgba(255,255,255,0.3); }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 20;
      gap: 24px;
    }
    #start-screen h1 {
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 2px;
      text-align: center;
    }
    #start-screen p {
      color: rgba(255,255,255,0.5);
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
    }
    #start-btn {
      font-size: 17px;
      padding: 14px 36px;
      background: rgba(255,200,80,0.2);
      border-color: rgba(255,200,80,0.6);
      color: #ffc850;
    }

    #mode-label {
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>PARTICLE VISION</h1>
  <p>Effet de réseau de particules interactif sur ta caméra en direct</p>
  <button id="start-btn">Activer la caméra</button>
</div>

<canvas id="canvas"></canvas>

<div id="ui" style="display:none">
  <button id="flip-btn">Flip cam</button>
  <span id="mode-label">Mode: Particules</span>
  <button id="mode-btn">Changer</button>
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');

let W, H;
let facingMode = 'user';
let stream = null;
let animId = null;

// Offscreen canvas for motion detection
const motionCanvas = document.createElement('canvas');
const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
let prevFrame = null;

// Particles
const PARTICLE_COUNT = 120;
const MAX_DIST = 130;
let particles = [];

// Modes: 0=particles overlay, 1=edge glow, 2=motion burst
let mode = 0;
const modeNames = ['Particules', 'Contours', 'Motion'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  motionCanvas.width = Math.floor(W / 4);
  motionCanvas.height = Math.floor(H / 4);
  initParticles();
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      r: Math.random() * 2.5 + 1,
      hue: Math.random() * 60 + 30, // golden tones
      life: Math.random(),
    });
  }
}

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    resize();
    document.getElementById('ui').style.display = 'flex';
    if (animId) cancelAnimationFrame(animId);
    loop();
  } catch (e) {
    alert('Impossible d\'accéder à la caméra: ' + e.message);
  }
}

// Motion detection: returns hot zones as array of {x,y,intensity}
function getMotionZones() {
  const mw = motionCanvas.width;
  const mh = motionCanvas.height;
  motionCtx.drawImage(video, 0, 0, mw, mh);
  const curr = motionCtx.getImageData(0, 0, mw, mh);
  const zones = [];
  if (!prevFrame) { prevFrame = curr; return zones; }

  const cd = curr.data;
  const pd = prevFrame.data;
  const step = 4 * 4; // sample every 4 pixels
  for (let i = 0; i < cd.length; i += step) {
    const diff = Math.abs(cd[i] - pd[i]) + Math.abs(cd[i+1] - pd[i+1]) + Math.abs(cd[i+2] - pd[i+2]);
    if (diff > 40) {
      const px = (i / 4) % mw;
      const py = Math.floor((i / 4) / mw);
      zones.push({
        x: (px / mw) * W,
        y: (py / mh) * H,
        intensity: Math.min(diff / 255, 1),
      });
    }
  }
  prevFrame = curr;
  return zones;
}

function loop() {
  animId = requestAnimationFrame(loop);
  if (video.readyState < 2) return;

  const motionZones = getMotionZones();

  // Draw video frame (mirrored for front cam)
  ctx.save();
  if (facingMode === 'user') {
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();

  if (mode === 0) drawParticles(motionZones);
  else if (mode === 1) drawEdgeGlow();
  else if (mode === 2) drawMotionBurst(motionZones);
}

function drawParticles(motionZones) {
  // Darken overlay slightly
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  // Push particles toward motion zones
  for (const p of particles) {
    for (const z of motionZones) {
      const dx = z.x - p.x;
      const dy = z.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 200) {
        p.vx += (dx / dist) * z.intensity * 0.4;
        p.vy += (dy / dist) * z.intensity * 0.4;
      }
    }

    // Damping
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.x += p.vx;
    p.y += p.vy;

    // Bounce
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    p.x = Math.max(0, Math.min(W, p.x));
    p.y = Math.max(0, Math.min(H, p.y));
  }

  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < MAX_DIST) {
        const alpha = (1 - d / MAX_DIST) * 0.7;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `hsla(${(a.hue + b.hue) / 2}, 90%, 75%, ${alpha})`;
        ctx.lineWidth = alpha * 1.5;
        ctx.stroke();
      }
    }
  }

  // Draw dots
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, 0.9)`;
    ctx.shadowColor = `hsla(${p.hue}, 100%, 70%, 0.8)`;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawEdgeGlow() {
  // Simple luminance edge detection via composite
  ctx.save();
  ctx.globalCompositeOperation = 'difference';
  ctx.filter = 'blur(2px)';
  if (facingMode === 'user') {
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();
  ctx.filter = 'none';

  // Golden tint overlay
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = 'rgba(255,180,30,0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

function drawMotionBurst(motionZones) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);

  for (const z of motionZones) {
    const r = z.intensity * 80 + 20;
    const grad = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, r);
    grad.addColorStop(0, `rgba(255,200,60,${z.intensity * 0.6})`);
    grad.addColorStop(0.5, `rgba(255,80,200,${z.intensity * 0.3})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(z.x, z.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // Still draw particles lightly
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, 0.3)`;
    ctx.fill();
  }
}

// Events
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  startCamera();
});

document.getElementById('flip-btn').addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

document.getElementById('mode-btn').addEventListener('click', () => {
  mode = (mode + 1) % 3;
  document.getElementById('mode-label').textContent = 'Mode: ' + modeNames[mode];
});

window.addEventListener('resize', resize);
</script>
</body>
</html>
